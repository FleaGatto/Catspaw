name: Build PyInstaller Packages

on:
  workflow_call:
    inputs:
      skip_macos:
        description: Build without the macOS package when macOS runners are unavailable.
        type: boolean
        default: false
        required: false
    outputs:
      app_version:
        description: Application version from pyproject.toml.
        value: ${{ jobs.prepare.outputs.app_version }}
      artifact_version:
        description: Version label used for build artifact filenames.
        value: ${{ jobs.prepare.outputs.artifact_version }}
      is_prerelease:
        description: Whether the canonical application version is a prerelease.
        value: ${{ jobs.prepare.outputs.is_prerelease }}
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PYTHONHASHSEED: '0'
  SOURCE_DATE_EPOCH: '0'
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  prepare:
    name: Prepare package metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Resolve build versions
        id: version
        run: |
          app_version="$(uv version --short)"
          artifact_version="$(uv run --no-project --with packaging python src/fleasion/version.py --artifact-version "$app_version")"
          if [ "$app_version" = "$artifact_version" ]; then
            is_prerelease=false
          else
            is_prerelease=true
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Select build matrix
        id: matrix
        shell: bash
        env:
          SKIP_MACOS: ${{ inputs.skip_macos }}
          ARTIFACT_VERSION: ${{ steps.version.outputs.artifact_version }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import os

          version = os.environ['ARTIFACT_VERSION']
          targets = [
              ('Windows', 'windows-latest', f'Fleasion-v{version}-Windows.exe', 'dist/Fleasion-v*-Windows.exe'),
              # Pinned, not 'latest': PyInstaller bundles the runner's own libglib, so the
              # runner's glibc becomes the floor for every machine that runs the build.
              # ubuntu-latest rolled to glibc 2.43 and the binaries stopped starting anywhere
              ('Linux', 'ubuntu-24.04', f'Fleasion-v{version}-Linux', 'dist/Fleasion-v*-Linux'),
          ]
          # Hosted macOS runners can stay unassigned long enough for the job to
          # be cancelled at the queue limit, which blocks the whole release
          if os.environ.get('SKIP_MACOS', '') != 'true':
              targets.append((
                  'macOS',
                  'macos-latest',
                  f'Fleasion-v{version}-MacOS-Universal.zip',
                  'dist/Fleasion-v*-MacOS-Universal.zip',
              ))
          include = [
              {'name': name, 'os': os_label, 'artifact_name': artifact, 'artifact_path': path}
              for name, os_label, artifact, path in targets
          ]
          print('matrix=' + json.dumps({'include': include}))
          PY

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libportaudio2 libpipewire-0.3-0 libspa-0.2-modules libpulse0

      - name: Install UPX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $maxRetries = 5
          $maxAttempts = $maxRetries + 1
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Installing UPX (attempt $attempt/$maxAttempts)..."
            choco install upx -y --no-progress
            $installExitCode = $LASTEXITCODE

            if ($installExitCode -eq 0) {
              if (Get-Command upx -ErrorAction SilentlyContinue) {
                upx --version
                if ($LASTEXITCODE -eq 0) {
                  break
                }
              }
            }

            if ($attempt -eq $maxAttempts) {
              throw "UPX installation failed after $maxAttempts attempts."
            }

            $delaySeconds = [int][Math]::Min(60, [Math]::Pow(2, $attempt) * 5)
            Write-Host "Retrying UPX installation in $delaySeconds seconds..."
            Start-Sleep -Seconds $delaySeconds
          }

      - name: Test Windows Qt startup path
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          uv run pytest -q
          tests/test_qt_startup_diagnostics.py
          tests/test_build_script.py

      - name: Test macOS proxy helper
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          uv run pytest -q
          tests/test_macos_proxy_helper.py
          tests/test_logging.py
          tests/test_autostart.py

      - name: Install Rosetta
        if: runner.os == 'macOS'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      # Smart App Control (policy VerifiedAndReputableDesktop) evaluates every
      # native module the process loads, not just the executable, and blocks the
      # unsigned ones with Code Integrity event 3077 (upstream #82, #84). The
      # modules it blocks ship unsigned in their own wheels -- Pillow 0 of 8 PE
      # files signed, PyQt6-sip 0 of 1, sounddevice's PortAudio 0 of 6 -- so
      # signing dist/*.exe alone cannot fix it: they have to be signed before
      # PyInstaller collects them into the one-file bundle.
      #
      # Without WINDOWS_SIGN_PFX_BASE64 this is a no-op, so forks and pull
      # requests still build exactly as before.
      - name: Sign bundled native modules
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_SIGN_PFX_BASE64) {
            Write-Host 'No signing certificate configured: bundled modules stay unsigned.'
            Write-Host 'Smart App Control will keep blocking them. See docs/windows-app-control.md.'
            exit 0
          }

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on this runner.' }

          $pfx = Join-Path $env:RUNNER_TEMP 'fleasion-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
          $timestampUrl = if ($env:WINDOWS_SIGN_TIMESTAMP_URL) {
            $env:WINDOWS_SIGN_TIMESTAMP_URL
          } else {
            'http://timestamp.digicert.com'
          }

          try {
            # Everything PyInstaller collects comes from the synced venv. Only
            # the unsigned files are touched, so the signatures Qt already ships
            # on its own DLLs are left exactly as they are
            $targets = Get-ChildItem .venv\Lib\site-packages -Recurse -Include *.pyd,*.dll -File |
              Where-Object { $_.FullName -notmatch '__pycache__' } |
              Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' }

            Write-Host "Signing $($targets.Count) unsigned native module(s)."
            for ($i = 0; $i -lt $targets.Count; $i += 50) {
              $batch = $targets[$i..([Math]::Min($i + 49, $targets.Count - 1))]
              & $signtool.FullName sign /f $pfx /p $env:WINDOWS_SIGN_PFX_PASSWORD `
                /fd SHA256 /tr $timestampUrl /td SHA256 $batch.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed on batch starting at $i." }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

          # Tells Fleasion.spec to leave UPX off: compressing a signed module
          # would discard the signature this step just applied
          'FLEASION_SIGN_BUNDLE=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build package
        run: uv run build

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_SIGN_PFX_BASE64) {
            Write-Host 'No signing certificate configured: the executable stays unsigned.'
            exit 0
          }

          $exe = Get-ChildItem dist/Fleasion-v*-Windows.exe | Select-Object -First 1
          if (-not $exe) { throw 'Could not find the Windows executable in dist/.' }

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on this runner.' }

          $pfx = Join-Path $env:RUNNER_TEMP 'fleasion-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
          $timestampUrl = if ($env:WINDOWS_SIGN_TIMESTAMP_URL) {
            $env:WINDOWS_SIGN_TIMESTAMP_URL
          } else {
            'http://timestamp.digicert.com'
          }

          try {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_SIGN_PFX_PASSWORD `
              /fd SHA256 /tr $timestampUrl /td SHA256 $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw 'signtool failed on the executable.' }
            & $signtool.FullName verify /pa $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw 'signtool could not verify the executable.' }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Windows lazy OpenGL payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/Fleasion-v*-Windows.exe | Select-Object -First 1
          if (-not $exe) {
            throw 'Could not find the Windows executable in dist/.'
          }
          $listing = uv run pyi-archive_viewer -r -b -l $exe.FullName | Out-String
          foreach ($required in @(
            'fleasion.cache.obj_viewer',
            'fleasion.cache.animation_viewer',
            'QtOpenGL',
            'opengl32sw.dll'
          )) {
            if ($listing -notmatch [regex]::Escape($required)) {
              throw "Windows package is missing required lazy OpenGL payload: $required"
            }
          }

      - name: Prepare Linux executable
        if: runner.os == 'Linux'
        run: |
          linux_binary="$(find dist -maxdepth 1 -type f -name 'Fleasion-v*-Linux' -print -quit)"
          if [ -z "$linux_binary" ]; then
            echo "Could not find Linux executable in dist/." >&2
            exit 1
          fi
          file "$linux_binary" | grep -q 'ELF'
          chmod 755 "$linux_binary"
          test -x "$linux_binary"

      - name: Verify Linux audio runtime
        if: runner.os == 'Linux'
        run: |
          archive_listing="$(uv run pyi-archive_viewer -b -l dist/Fleasion-v*-Linux)"
          printf '%s\n' "$archive_listing" | grep -Ei 'portaudio|pulse|pipewire|jack|alsa|sound' || true
          if [[ "$archive_listing" =~ lib(portaudio|asound|jack|pulse|pulsecommon-|pipewire-) ]]; then
            echo "Linux package must use host audio backend libraries, not the GitHub runner copies." >&2
            exit 1
          fi

      - name: Verify Linux compiled Python dependencies
        if: runner.os == 'Linux'
        run: |
          archive_listing="$(uv run pyi-archive_viewer -b -l dist/Fleasion-v*-Linux)"
          if ! grep -q 'DracoPy' <<< "$archive_listing"; then
            echo "Linux package is missing the bundled DracoPy extension." >&2
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          archive: false
          if-no-files-found: error
